<!-- Durable workflow, as in the designer (right): an event arrives, a human task and an agent run side by side,
     then a decision and payment. Left: the task inbox where a person approves, and the agent's chat.
     Drawn outside 0-1200 on purpose: the build shows -200..1400, and the sides stay clear of the text. -->
